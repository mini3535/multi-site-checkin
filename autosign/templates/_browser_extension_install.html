<details class="form-details extension-install">
  <summary>首次安装或更新浏览器扩展</summary>
  <div class="details-content">
    <ol>
      <li><a href="{{ url_for('browser_extension_download') }}">下载与当前助手配套的扩展 ZIP</a>，解压到固定文件夹。</li>
      <li>在 Chrome 地址栏打开 <code>chrome://extensions</code>，开启“开发者模式”，点击“加载已解压的扩展程序”，选择刚解压的文件夹。</li>
      <li>回到目标网站，打开扩展弹窗，确认有链接输入框和“识别网页并连接账号”按钮；当前版本显示在弹窗顶部。</li>
    </ol>
    <p>若仍只有“导出并下载”，请用新包覆盖原来的扩展文件夹，再到扩展管理页点刷新；也可移除旧扩展，重新加载新文件夹。仅刷新旧文件夹不会下载更新。</p>
    <p>扩展尚未上架 Chrome 应用商店，首次需要手动安装。安装完成后，添加其他网站无需重复安装。</p>
  </div>
</details>
