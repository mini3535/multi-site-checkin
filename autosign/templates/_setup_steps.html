<nav class="setup-progress" aria-label="添加网站进度">
  <ol>
    {% for label in ['选择网站', '连接账号', '验证签到', '每天自动执行'] %}
    <li class="{{ 'step-current' if flow_step == loop.index else ('step-complete' if flow_step > loop.index else '') }}" {% if flow_step == loop.index %}aria-current="step"{% endif %}><span>{{ '✓' if flow_step > loop.index else loop.index }}</span><strong>{{ label }}</strong></li>
    {% endfor %}
  </ol>
</nav>
