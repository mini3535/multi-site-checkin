{% extends 'base.html' %}
{% block title %}修改密码 · 签到助手{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('index') }}">← 返回任务总览</a>
<div class="form-heading"><p class="eyebrow">ACCOUNT SECURITY</p><h1>修改登录密码<span class="heading-dot">.</span></h1><p class="muted">修改后所有设备需重新登录。网站账号、会话和签到任务不受影响。</p></div>
{% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
<form class="task-form" method="post" action="{{ url_for('change_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <section class="form-section"><div class="form-section-description"><span class="step-number">01</span><h2>管理员密码</h2><p>使用 12 至 256 字符的新密码。<br>请妥善保管，页面不会回显密码。</p></div><div class="form-section-fields">
    <div class="field"><label for="current_password">当前密码</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="256" required></div>
    <div class="field"><label for="new_password">新密码</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
    <div class="field"><label for="confirm_password">确认新密码</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
  </div></section>
  <div class="form-footer"><p>密码以哈希形式保存，重启或升级后继续有效。</p><button type="submit" class="button button-primary">修改密码并重新登录 →</button></div>
</form>
{% endblock %}
