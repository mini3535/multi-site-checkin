<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>连接签到助手</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">BROWSER SESSION <span>v1.3.1</span></p>
      <h1>连接网站账号</h1>
      <p class="host" id="host">正在读取当前页面…</p>
      <label for="pairing-link">粘贴签到助手页面生成的一次性链接</label>
      <textarea id="pairing-link" rows="3" spellcheck="false" autocomplete="off" placeholder="https://你的签到助手/#signin-pairing=…"></textarea>
      <p class="destination" id="destination" hidden></p>
      <button id="connect" type="button" disabled>识别网页并连接账号</button>
      <p class="status" id="status" role="status" aria-live="polite">先切到已登录的网站标签页，再粘贴助手链接。点击后才会读取本页并发送登录状态。</p>
      <details>
        <summary>改用本机文件导出</summary>
        <p class="notice">导出文件等同登录凭据，只上传到你自己的签到助手，导入后删除本地文件。</p>
        <button id="export" class="secondary" type="button" disabled>导出并下载 JSON</button>
      </details>
    </main>
  </body>
</html>
