name: autosign

services:
  app:
    image: ${AUTOSIGN_IMAGE:-ghcr.io/mini3535/multi-site-checkin:latest}
    restart: unless-stopped
    stop_grace_period: 110s
    shm_size: 256mb
    init: true
    security_opt:
      - seccomp=${PWD}/seccomp_profile.json
    env_file:
      - path: .env
        required: false
    environment:
      AUTOSIGN_DATA_DIR: /data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - data:/data
      - update_control:/run/autosign-update:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3

  updater:
    image: ${AUTOSIGN_IMAGE:-ghcr.io/mini3535/multi-site-checkin:latest}
    user: "0:0"
    command: ["python", "-m", "autosign.updater"]
    restart: unless-stopped
    environment:
      AUTOSIGN_DEPLOY_DIR: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
      - data:/data
      - update_control:/run/autosign-update
    healthcheck:
      test: ["CMD", "python", "-c", "from autosign.update_client import call; r=call('status'); assert 'phase' in r and r['phase'] != 'unavailable'"]
      interval: 30s
      timeout: 8s
      retries: 3

  web:
    image: caddy:2-alpine
    profiles: [web]
    restart: unless-stopped
    environment:
      AUTOSIGN_DOMAIN: ${AUTOSIGN_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  tunnel:
    image: ${AUTOSIGN_TUNNEL_IMAGE:-tailscale/tailscale:v1.104.7}
    profiles: [tunnel]
    restart: unless-stopped
    # Userspace networking needs no TUN device or privileged capabilities.
    # Share only the app's network so Funnel can proxy to localhost:8080.
    network_mode: service:app
    environment:
      TS_HOSTNAME: ${AUTOSIGN_TUNNEL_HOSTNAME:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 10m
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --accept-routes=false
    volumes:
      - tailscale_data:/var/lib/tailscale
    depends_on:
      app:
        condition: service_healthy
        restart: true

volumes:
  data:
  update_control:
  caddy_data:
  caddy_config:
  tailscale_data:
